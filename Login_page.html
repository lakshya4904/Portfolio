<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Login Page</title>
  <meta name="description" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex-col m-0 items-center justify-center bg-cover bg-center"
  style="background-image: url('../images/LoginPage_Background.avif');">
  <!-- Header -->
  <header class="bg-dark text-white text-center">
    <nav class="bg-gray-900 text-white">
      <div class="container mx-auto px-4 py-3 flex justify-between items-center">
        <!-- Brand -->
        <div class="text-2xl font-bold">
          <a href="./index.html">Lakshya U.</a>
        </div>
        
        <!-- Hamburger Menu (for mobile) -->
        <div class="md:hidden">
          <button id="menu-btn" class="focus:outline-none">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-8 h-8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6h16.5M3.75 12h16.5M3.75 18h16.5" />
            </svg>
          </button>
        </div>
        
        <!-- Menu Links (hidden on mobile) -->
        <ul id="menu" class="hidden md:flex space-x-6">
          <li><a href="./index.html" class="hover:underline">Home</a></li>
          <li><a href="./About_page.html" class="hover:underline">About</a></li>
          <li><a href="./Review_page.html" class="hover:underline">Review Paper</a></li>
          <li><a href="./Contact_page.html" class="hover:underline">Contact</a></li>
          <li><a href="#" class="hover:underline">Login</a></li>
        </ul>
      </div>
      
      <!-- Dropdown Menu for Mobile -->
      <ul id="mobile-menu" class="hidden md:hidden flex flex-col space-y-2 px-4 bg-gray-800">
        <li><a href="./index.html" class="hover:underline">Home</a></li>
          <li><a href="./About_page.html" class="hover:underline">About</a></li>
          <li><a href="./Review_page.html" class="hover:underline">Review Paper</a></li>
          <li><a href="./Contact_page.html" class="hover:underline">Contact</a></li>
          <li><a href="#" class="hover:underline">Login</a></li>
        </ul>
    </nav>
  </header>

  <script>
    // JavaScript to toggle mobile menu
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    const menu = document.getElementById('menu');

    menuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
    });
  </script>

  <div class="flex justify-center items-center h-[90vh]">

    <div
      class="bg-gray-900 bg-opacity-50 border border-white border-opacity-20 shadow-lg backdrop-blur-lg text-white p-8 rounded-lg w-96 flex h-fit justify-center">
      <form class="">
        <h1 class="text-3xl text-center mb-8">Login</h1>

        <div class="relative mb-6">
          <input
            class="w-full h-12 bg-transparent border-2 border-white text-white placeholder-white rounded-full px-6 focus:outline-none"
            type="text" id="username" placeholder="Username" required>
          <i class="bx bxs-user absolute right-5 top-1/2 transform -translate-y-1/2"></i>
        </div>

        <div class="relative mb-6">
          <input
            class="w-full h-12 bg-transparent border-2 border-white text-white placeholder-white rounded-full px-6 focus:outline-none"
            type="password" id="password" placeholder="Password" required>
          <i class="bx bxs-lock-alt absolute right-5 top-1/2 transform -translate-y-1/2"></i>
        </div>

        <div class="flex justify-between items-center mb-4">
          <label class="flex items-center">
            <input type="checkbox" class="text-white mr-2">
            <span>Remember Me</span>
          </label>
          <a href="#" class="text-white hover:underline">Forgot Password?</a>
        </div>

        <button
          class="w-full bg-amber-600 bg-opacity-70 text-white rounded-md py-3 hover:bg-opacity-90 focus:outline-none transition-all duration-300"
          type="submit" onclick="validate()">Login</button>

        <div class="text-center mt-4">
          <p>Don't have an account,
            <a href="./SingIn_page.html" class="text-white font-bold hover:underline">Register</a>
          </p>
        </div>
      </form>
    </div>
  </div>

</body>

</html>
